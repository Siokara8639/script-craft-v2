<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <title>Script Craft</title>

  <link
    rel="stylesheet"
    href="style.css">

</head>

<body>

<div id="topbar">

  <button class="tabBtn">
    スクリプト生成
  </button>

  <button id="settingsBtn">
    設定
  </button>

</div>

<div id="settingsPanel">

  <button id="backBtn">
  ← 戻る
</button>
  
  <h3>設定</h3>

  <button id="langBtn">
    言語設定
  </button>

  <select id="languageSelect">

    <option value="ja">
      日本語
    </option>

    <option value="en">
      English
    </option>

  </select>

</div>

<div id="container">

    <div id="editor"></div>

    <div id="chat">

      <div id="messages"></div>

      <div id="chatBottom">

        <textarea
          id="chatInput"
          placeholder="Ask AI..."
        ></textarea>

        <button id="sendBtn">
          Send
        </button>

      </div>

    </div>

  </div>

<script src="
https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js">
</script>

<script src="
https://cdn.jsdelivr.net/npm/marked/marked.min.js">
</script>
 
<link rel="stylesheet"
href="
https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">

<script src="
https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js">
</script>
 
<script src="main.js"></script>

</body>

  <script src="

</body>

</html>
